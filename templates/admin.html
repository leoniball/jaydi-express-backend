<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - Jaydi Drivers</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f5f6fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-custom { background: linear-gradient(90deg, #00337C 0%, #F07D00 100%); }
        .card-driver { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .doc-thumb { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; cursor: pointer; transition: transform 0.2s; border: 1px solid #ddd; }
        .doc-thumb:hover { transform: scale(1.05); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .doc-label { font-size: 0.8rem; font-weight: bold; text-align: center; margin-top: 5px; color: #555; }
        .btn-aprobar { background-color: #00337C; color: white; font-weight: bold; border-radius: 8px; }
        .btn-aprobar:hover { background-color: #002255; color: white; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark navbar-custom mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-shield-check me-2"></i> Jaydi KYC Admin Panel
            </a>
            <span class="navbar-text text-white fw-bold">
                Aprobación de Conductores
            </span>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h4" style="color: #00337C; font-weight: bold;">Solicitudes Pendientes</h2>
            <button class="btn btn-outline-secondary btn-sm" onclick="cargarConductores()">
                <i class="bi bi-arrow-clockwise"></i> Actualizar
            </button>
        </div>

        <!-- Contenedor donde se inyectarán las tarjetas de los conductores -->
        <div id="conductores-container" class="row">
            <div class="col-12 text-center mt-5" id="loading-spinner">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
                <p class="mt-2 text-muted">Buscando solicitudes en AWS S3...</p>
            </div>
        </div>
    </div>

    <!-- Modal para ver imágenes en tamaño completo -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalImageTitle">Documento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body text-center bg-dark">
                    <img id="fullSizeImage" src="" alt="Documento Ampliado" class="img-fluid rounded" style="max-height: 70vh;">
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Lógica de la aplicación -->
    <script>
        const imageModal = new bootstrap.Modal(document.getElementById('imageModal'));

        // Al cargar la página
        document.addEventListener("DOMContentLoaded", () => {
            cargarConductores();
        });

        // 1. Obtener la lista de conductores pendientes
        async function cargarConductores() {
            const container = document.getElementById('conductores-container');
            container.innerHTML = `
                <div class="col-12 text-center mt-5" id="loading-spinner">
                    <div class="spinner-border" style="color: #F07D00;" role="status"></div>
                    <p class="mt-2 text-muted">Consultando base de datos...</p>
                </div>`;

            try {
                // Llama al endpoint de Flask que creamos
                const response = await fetch('/api/admin/conductores_pendientes');
                const data = await response.json();

                container.innerHTML = ''; // Limpiar spinner

                if (data.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center mt-5">
                            <i class="bi bi-check-circle text-success" style="font-size: 3rem;"></i>
                            <h4 class="mt-3">Todo al día</h4>
                            <p class="text-muted">No hay conductores pendientes de aprobación.</p>
                        </div>`;
                    return;
                }

                // Generar tarjetas para cada conductor
                data.forEach(conductor => {
                    const card = document.createElement('div');
                    card.className = 'col-12';
                    card.innerHTML = `
                        <div class="card card-driver p-4">
                            <div class="row">
                                <!-- Datos del conductor -->
                                <div class="col-md-3 border-end">
                                    <h5 class="text-primary fw-bold mb-1">${conductor.nombres} ${conductor.apellidos}</h5>
                                    <p class="text-muted small mb-3">ID Usuario: #${conductor.user_id}</p>
                                    
                                    <p class="mb-1"><i class="bi bi-person-vcard text-secondary"></i> <strong>C.I:</strong> ${conductor.cedula_texto}</p>
                                    <p class="mb-1"><i class="bi bi-telephone text-secondary"></i> <strong>Tel:</strong> ${conductor.telefono}</p>
                                    <p class="mb-3"><i class="bi bi-geo-alt text-secondary"></i> <strong>Dir:</strong> ${conductor.direccion}</p>
                                    
                                    <button class="btn btn-aprobar w-100 mt-2 shadow-sm" onclick="aprobarConductor(${conductor.conductor_id}, this)">
                                        <i class="bi bi-check2-circle"></i> Aprobar Conductor
                                    </button>
                                </div>
                                
                                <!-- Documentos (Imágenes) -->
                                <div class="col-md-9">
                                    <h6 class="mb-3 text-secondary border-bottom pb-2">Documentos Adjuntos (AWS S3)</h6>
                                    <div class="row text-center g-3">
                                        <div class="col">
                                            <img src="${conductor.documentos.cedula_img}" class="doc-thumb" onclick="verImagen(this.src, 'Cédula de Identidad')" onerror="manejarErrorImagen(this)">
                                            <div class="doc-label">Cédula</div>
                                        </div>
                                        <div class="col">
                                            <img src="${conductor.documentos.licencia}" class="doc-thumb" onclick="verImagen(this.src, 'Licencia de Conducir')" onerror="manejarErrorImagen(this)">
                                            <div class="doc-label">Licencia</div>
                                        </div>
                                        <div class="col">
                                            <img src="${conductor.documentos.cert_medico}" class="doc-thumb" onclick="verImagen(this.src, 'Certificado Médico')" onerror="manejarErrorImagen(this)">
                                            <div class="doc-label">Cert. Médico</div>
                                        </div>
                                        <div class="col">
                                            <img src="${conductor.documentos.carnet_circulacion}" class="doc-thumb" onclick="verImagen(this.src, 'Carnet de Circulación')" onerror="manejarErrorImagen(this)">
                                            <div class="doc-label">Circulación</div>
                                        </div>
                                        <div class="col">
                                            <img src="${conductor.documentos.seguro}" class="doc-thumb" onclick="verImagen(this.src, 'Seguro del Vehículo')" onerror="manejarErrorImagen(this)">
                                            <div class="doc-label">Seguro</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error("Error cargando conductores:", error);
                container.innerHTML = `<div class="alert alert-danger">Error de conexión al cargar los datos.</div>`;
            }
        }

        // 2. Función para aprobar al conductor
        async function aprobarConductor(id, botonContexto) {
            if(!confirm("¿Estás seguro de que todos los documentos son válidos y deseas aprobar a este conductor?")) return;

            // Cambiar estado del botón mientras procesa
            botonContexto.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Aprobando...';
            botonContexto.disabled = true;

            try {
                const response = await fetch(`/api/admin/aprobar_conductor/${id}`, {
                    method: 'POST'
                });
                const result = await response.json();

                if(response.ok) {
                    // Animación para desaparecer la tarjeta
                    const tarjeta = botonContexto.closest('.card-driver');
                    tarjeta.style.transition = "opacity 0.5s ease";
                    tarjeta.style.opacity = "0";
                    setTimeout(() => {
                        tarjeta.remove();
                        // Si ya no quedan tarjetas, recargar para mostrar el mensaje de vacío
                        if(document.querySelectorAll('.card-driver').length === 0) {
                            cargarConductores();
                        }
                    }, 500);
                } else {
                    alert("Error al aprobar: " + (result.mensaje || result.error));
                    botonContexto.innerHTML = '<i class="bi bi-check2-circle"></i> Aprobar Conductor';
                    botonContexto.disabled = false;
                }
            } catch (error) {
                console.error("Error al aprobar:", error);
                alert("Error de red. Inténtalo de nuevo.");
                botonContexto.innerHTML = '<i class="bi bi-check2-circle"></i> Aprobar Conductor';
                botonContexto.disabled = false;
            }
        }

        // 3. Funciones visuales para el modal de imágenes
        function verImagen(url, titulo) {
            document.getElementById('fullSizeImage').src = url;
            document.getElementById('modalImageTitle').innerText = titulo;
            imageModal.show();
        }

        function manejarErrorImagen(imgElement) {
            // Si S3 devuelve error (ej. permisos o archivo corrupto), muestra un placeholder
            imgElement.src = 'https://via.placeholder.com/150x120.png?text=No+disponible';
            imgElement.style.cursor = 'default';
            imgElement.onclick = null;
        }
    </script>
</body>
</html>
