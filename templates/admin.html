<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo Maestro - Jaydi Drivers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f1f3f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-custom { background: linear-gradient(90deg, #031634 0%, #00337C 100%); }
        .card-driver { border: none; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 20px; background: #fff; }
        .doc-thumb { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 1px solid #ddd; }
        .doc-thumb:hover { opacity: 0.8; }
        .doc-label { font-size: 0.75rem; font-weight: bold; text-align: center; margin-top: 4px; color: #444; }
        .data-table th { background-color: #f8f9fa; width: 30%; font-size: 0.85rem;}
        .data-table td { font-size: 0.9rem; font-weight: bold; color: #00337C; }
        .chat-burbuja { padding: 8px 12px; border-radius: 15px; margin-bottom: 5px; max-width: 80%; font-size: 0.85rem; }
        .chat-conductor { background-color: #d1e7dd; align-self: flex-end; border-bottom-right-radius: 0; }
        .chat-cliente { background-color: #f8d7da; align-self: flex-start; border-bottom-left-radius: 0; }
        .chat-container { display: flex; flex-direction: column; max-height: 250px; overflow-y: auto; background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px solid #ddd;}
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-custom mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-speedometer me-2"></i> Jaydi KYC & Monitor
            </a>
        </div>
    </nav>

    <div class="container">
        <!-- Pestañas de Navegación -->
        <ul class="nav nav-tabs fw-bold mb-4" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active text-warning" id="pendientes-tab" data-bs-toggle="tab" data-bs-target="#pendientes" type="button" onclick="cargarConductores('pending', 'pendientes-container')">
                    <i class="bi bi-hourglass-split"></i> Solicitudes Pendientes
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link text-success" id="activos-tab" data-bs-toggle="tab" data-bs-target="#activos" type="button" onclick="cargarConductores('approved', 'activos-container')">
                    <i class="bi bi-check-circle-fill"></i> Conductores Activos
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link text-danger" id="suspendidos-tab" data-bs-toggle="tab" data-bs-target="#suspendidos" type="button" onclick="cargarConductores('suspended', 'suspendidos-container')">
                    <i class="bi bi-slash-circle-fill"></i> Suspendidos
                </button>
            </li>
        </ul>

        <!-- Contenedores de las Pestañas -->
        <div class="tab-content" id="myTabContent">
            <!-- PENDIENTES -->
            <div class="tab-pane fade show active" id="pendientes" role="tabpanel">
                <div id="pendientes-container" class="row"></div>
            </div>
            
            <!-- ACTIVOS -->
            <div class="tab-pane fade" id="activos" role="tabpanel">
                <div id="activos-container" class="row"></div>
            </div>

            <!-- SUSPENDIDOS -->
            <div class="tab-pane fade" id="suspendidos" role="tabpanel">
                <div id="suspendidos-container" class="row"></div>
            </div>
        </div>
    </div>

    <!-- Modal Visor de Imágenes -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content bg-dark border-0">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-white" id="modalImageTitle">Documento</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center p-0">
                    <img id="fullSizeImage" src="" class="img-fluid w-100" style="max-height: 85vh; object-fit: contain;">
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Historial y Chats -->
    <div class="modal fade" id="historialModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold"><i class="bi bi-clock-history"></i> Historial y Mensajería del Conductor</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="historial-body">
                    <!-- Contenido inyectado por JS -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const imageModal = new bootstrap.Modal(document.getElementById('imageModal'));
        const historialModal = new bootstrap.Modal(document.getElementById('historialModal'));

        // Cargar pendientes al iniciar
        document.addEventListener("DOMContentLoaded", () => cargarConductores('pending', 'pendientes-container'));

        // CARGAR CONDUCTORES SEGÚN ESTADO
        async function cargarConductores(estado, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = `<div class="col-12 text-center mt-4"><div class="spinner-border text-primary"></div><p>Cargando datos...</p></div>`;

            try {
                const response = await fetch(`/api/admin/conductores?estado=${estado}`);
                const data = await response.json();
                container.innerHTML = '';

                if (data.length === 0) {
                    container.innerHTML = `<div class="col-12 text-center mt-5 text-muted"><h5>No hay registros en esta categoría.</h5></div>`;
                    return;
                }

                data.forEach(c => {
                    const card = document.createElement('div');
                    card.className = 'col-12';
                    
                    // Render condicional de botones según estado
                    let botonesHTML = '';
                    if (estado === 'pending') {
                        botonesHTML = `
                            <button class="btn btn-success w-100 fw-bold mb-2" onclick="cambiarEstado(${c.conductor_id}, 'aprobar', this)"><i class="bi bi-check-lg"></i> Aprobar Conductor</button>
                            <button class="btn btn-outline-danger w-100 fw-bold" onclick="cambiarEstado(${c.conductor_id}, 'suspender', this)"><i class="bi bi-x-lg"></i> Rechazar</button>
                        `;
                    } else if (estado === 'approved') {
                        botonesHTML = `
                            <button class="btn btn-primary w-100 fw-bold mb-2" onclick="verHistorialYChats(${c.user_id}, '${c.nombres} ${c.apellidos}')"><i class="bi bi-chat-left-text"></i> Ver Historial y Mensajería</button>
                            <button class="btn btn-danger w-100 fw-bold" onclick="cambiarEstado(${c.conductor_id}, 'suspender', this)"><i class="bi bi-exclamation-triangle"></i> SUSPENDER ACCESO</button>
                        `;
                    } else if (estado === 'suspended') {
                        botonesHTML = `
                            <button class="btn btn-warning w-100 fw-bold mb-2 text-dark" onclick="cambiarEstado(${c.conductor_id}, 'aprobar', this)"><i class="bi bi-arrow-counterclockwise"></i> Reactivar Conductor</button>
                            <button class="btn btn-secondary w-100 fw-bold" onclick="verHistorialYChats(${c.user_id}, '${c.nombres} ${c.apellidos}')"><i class="bi bi-search"></i> Revisar Historial</button>
                        `;
                    }

                    // Tarjeta Maestra
                    card.innerHTML = `
                        <div class="card card-driver p-0 overflow-hidden">
                            <div class="row g-0">
                                <!-- Columna Izquierda: Datos Estrictos -->
                                <div class="col-md-4 bg-light p-3 border-end">
                                    <h5 class="fw-bold text-dark mb-3"><i class="bi bi-person-badge"></i> Datos del Registro</h5>
                                    <table class="table table-sm table-bordered data-table mb-3">
                                        <tbody>
                                            <tr><th>ID Sistema</th><td>#${c.user_id}</td></tr>
                                            <tr><th>Nombres</th><td>${c.nombres}</td></tr>
                                            <tr><th>Apellidos</th><td>${c.apellidos}</td></tr>
                                            <tr><th>Cédula</th><td>${c.cedula_texto}</td></tr>
                                            <tr><th>Teléfono</th><td>${c.telefono}</td></tr>
                                            <tr><th>Dirección</th><td><small>${c.direccion}</small></td></tr>
                                            ${estado === 'approved' ? `<tr><th>Carreras Exitosas</th><td class="text-success">${c.viajes_completados}</td></tr>` : ''}
                                        </tbody>
                                    </table>
                                    ${botonesHTML}
                                </div>
                                
                                <!-- Columna Derecha: Documentos Obligatorios -->
                                <div class="col-md-8 p-3">
                                    <h6 class="fw-bold text-secondary mb-3"><i class="bi bi-folder2-open"></i> Documentos Verificados (S3 AWS)</h6>
                                    <div class="row g-2">
                                        <div class="col-4 col-md-2">
                                            <img src="${c.documentos.cedula_img}" class="doc-thumb" onclick="verImagen(this.src, 'Cédula de Identidad')">
                                            <div class="doc-label">Cédula</div>
                                        </div>
                                        <div class="col-4 col-md-2">
                                            <img src="${c.documentos.licencia}" class="doc-thumb" onclick="verImagen(this.src, 'Licencia de Conducir')">
                                            <div class="doc-label">Licencia</div>
                                        </div>
                                        <div class="col-4 col-md-2">
                                            <img src="${c.documentos.cert_medico}" class="doc-thumb" onclick="verImagen(this.src, 'Certificado Médico')">
                                            <div class="doc-label">Cert. Médico</div>
                                        </div>
                                        <div class="col-4 col-md-2">
                                            <img src="${c.documentos.carnet_circulacion}" class="doc-thumb" onclick="verImagen(this.src, 'Carnet de Circulación')">
                                            <div class="doc-label">Circulación</div>
                                        </div>
                                        <div class="col-4 col-md-2">
                                            <img src="${c.documentos.seguro}" class="doc-thumb" onclick="verImagen(this.src, 'Seguro Vehicular')">
                                            <div class="doc-label">Seguro</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                container.innerHTML = `<div class="alert alert-danger">Error de red: ${error.message}</div>`;
            }
        }

        // CAMBIAR ESTADO (Aprobar o Suspender)
        async function cambiarEstado(id, accion, boton) {
            const esSuspension = accion === 'suspender';
            if(esSuspension && !confirm("ALERTA: Vas a suspender el acceso de este conductor. Ya no podrá aceptar carreras. ¿Proceder?")) return;
            if(!esSuspension && !confirm("¿Aprobar y autorizar a este conductor?")) return;

            boton.disabled = true;
            boton.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Procesando...';

            const endpoint = esSuspension ? `/api/admin/suspender_conductor/${id}` : `/api/admin/aprobar_conductor/${id}`;

            try {
                const res = await fetch(endpoint, { method: 'POST' });
                if(res.ok) {
                    const tarjeta = boton.closest('.col-12');
                    tarjeta.remove(); // Desaparece la tarjeta de la lista actual
                } else {
                    alert("Error en el servidor al ejecutar la orden.");
                    boton.disabled = false;
                }
            } catch(e) {
                alert("Error de conexión.");
                boton.disabled = false;
            }
        }

        // VISUALIZAR HISTORIAL Y MENSAJERÍA
        async function verHistorialYChats(userId, nombreConductor) {
            const body = document.getElementById('historial-body');
            body.innerHTML = '<div class="text-center p-4"><div class="spinner-border text-primary"></div><p>Buscando registros...</p></div>';
            historialModal.show();

            try {
                const res = await fetch(`/api/admin/conductor_chats/${userId}`);
                const data = await res.json();

                if (data.length === 0) {
                    body.innerHTML = `<div class="alert alert-secondary">El conductor <b>${nombreConductor}</b> no tiene viajes registrados en el historial.</div>`;
                    return;
                }

                let html = `<h6 class="fw-bold mb-3 text-primary">Registro de actividad de ${nombreConductor}</h6>`;
                
                data.forEach(viaje => {
                    // Generar burbujas de chat si existen
                    let chatHTML = '';
                    if (viaje.hubo_chat) {
                        chatHTML = '<div class="chat-container mt-2">';
                        viaje.mensajes.forEach(m => {
                            const esConductor = m.remitente === 'repartidor';
                            const claseBurbuja = esConductor ? 'chat-conductor' : 'chat-cliente';
                            const etiqueta = esConductor ? 'Conductor' : 'Cliente';
                            chatHTML += `
                                <div class="chat-burbuja ${claseBurbuja} border shadow-sm">
                                    <strong>${etiqueta} (${m.hora}):</strong> ${m.texto}
                                </div>
                            `;
                        });
                        chatHTML += '</div>';
                    } else {
                        chatHTML = '<div class="text-muted small mt-2"><i class="bi bi-chat-slash"></i> Sin mensajes registrados en este viaje.</div>';
                    }

                    html += `
                        <div class="card mb-3 border border-secondary shadow-sm">
                            <div class="card-header bg-light d-flex justify-content-between align-items-center">
                                <span class="fw-bold text-dark">Viaje #${viaje.pedido_id}</span>
                                <span class="badge ${viaje.estado_carrera === 'entregado' ? 'bg-success' : 'bg-warning text-dark'}">${viaje.estado_carrera.toUpperCase()}</span>
                            </div>
                            <div class="card-body py-2">
                                <p class="mb-1"><small><strong>Fecha:</strong> ${viaje.fecha}</small> | <small><strong>Tarifa:</strong> $${viaje.total_usd}</small></p>
                                <p class="mb-2"><small><strong>Destino:</strong> ${viaje.destino}</small></p>
                                <h6 class="fw-bold text-secondary mt-3 border-bottom pb-1" style="font-size:0.8rem;">Registro de Conversación</h6>
                                ${chatHTML}
                            </div>
                        </div>
                    `;
                });

                body.innerHTML = html;

            } catch(e) {
                body.innerHTML = `<div class="alert alert-danger">No se pudo cargar el historial: ${e.message}</div>`;
            }
        }

        // VISOR DE DOCUMENTOS
        function verImagen(url, titulo) {
            document.getElementById('fullSizeImage').src = url;
            document.getElementById('modalImageTitle').innerText = titulo;
            imageModal.show();
        }
    </script>
</body>
</html>
